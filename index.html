<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏃🏿‍♂️RUN.🤖AI 📻Radio♾️</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Orbitron', sans-serif;
  background:#000;
  color:#0ff;
  text-align:center;
}
body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:radial-gradient(circle,#001,#000);
  z-index:-1;
}
h1{
  font-size:40px;
  text-shadow:0 0 20px #0ff;
}
.player{
  width:300px;
  margin:auto;
  background:#0a0a0a;
  border-radius:20px;
  padding:20px;
  box-shadow:0 0 30px #0ff;
}
.cover{
  width:100%;
  border-radius:15px;
}
.controls button{
  background:#111;
  color:#0ff;
  border:none;
  padding:10px;
  margin:5px;
  border-radius:50%;
  box-shadow:0 0 10px #0ff;
}
#visualizer{
  width:100%;
  height:80px;
}
.features{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin:20px;
}
.box{
  width:120px;
  background:#111;
  padding:10px;
  border-radius:10px;
}
.carousel{
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:10px;
}
.card{
  min-width:140px;
  background:#111;
  padding:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<h1>🏃🏿‍♂️RUN.🤖AI 📻Radio</h1>
<div>Stream. Earn. Vibez.</div>

<div class="player">
  <img src="IMG-20260511-WA0001.jpg" class="cover">
  <h3 id="trackTitle">Future Vibez</h3>

  <canvas id="visualizer"></canvas>

  <div class="controls">
    <button onclick="prevTrack()">⏮</button>
    <button onclick="audio.play()">▶</button>
    <button onclick="audio.pause()">⏸</button>
    <button onclick="nextTrack()">⏭</button>
    <button onclick="toggleShuffle()" id="shuffleBtn">🔀</button>
    <button onclick="toggleLoop()" id="loopBtn">🔁</button>
  </div>

  <input type="range" id="progress" value="0" style="width:100%;">
  <div id="time">0:00 / 0:00</div>
</div>

<audio id="audio"></audio>

<div id="playlist"></div>

<div class="features">
  <div class="box">📡 LIVE</div>
  <div class="box">💰 EARN</div>
  <div class="box">👥 JOIN</div>
  <div class="box">🎵 STREAM</div>
  <div class="box">⚡ AI</div>
  <div class="box">🎤 ARTISTS</div>
</div>

<h3>🛍 Store</h3>
<div class="carousel">
  <div class="card">🎧 Headphones</div>
  <div class="card">👕 Merch</div>
  <div class="card">💿 Tracks</div>
</div>

<div style="margin:20px;">
  <button onclick="window.open('https://chatgpt.com/gg/v/69edd27aec0881939b3622d930d54f13?token=zOLoIYdA4hjhAU7JxKal1g')">
    🎙 DJ Chat
  </button>
</div>

<script>

// ================= AUDIO =================
const audio = document.getElementById("audio");
const progress = document.getElementById("progress");
const timeDisplay = document.getElementById("time");
const title = document.getElementById("trackTitle");

// ================= PLAYLIST =================
const tracks = [
  {src:"music/new1.mp3", title:"Track 1"},
  {src:"music/new2.mp3", title:"Track 2"},
  {src:"music/new3.mp3", title:"Track 3"}
];

let currentIndex = 0;
let isShuffle = false;
let isLoop = false;

// ================= LOAD =================
function loadTrack(i){
  currentIndex = i;
  audio.src = tracks[i].src;
  title.innerText = tracks[i].title;
  audio.play().catch(()=>{});
  highlightTrack();
}

// ================= CONTROLS =================
function nextTrack(){
  currentIndex = isShuffle
    ? Math.floor(Math.random()*tracks.length)
    : (currentIndex+1)%tracks.length;
  loadTrack(currentIndex);
}

function prevTrack(){
  currentIndex = (currentIndex-1+tracks.length)%tracks.length;
  loadTrack(currentIndex);
}

function toggleShuffle(){
  isShuffle=!isShuffle;
  shuffleBtn.classList.toggle("active");
}

function toggleLoop(){
  isLoop=!isLoop;
  loopBtn.classList.toggle("active");
}

// ================= AUTO NEXT =================
audio.addEventListener("ended", ()=>{
  if(isLoop){
    audio.currentTime = 0;
    audio.play();
  } else {
    nextTrack();
  }
});

// ================= PROGRESS =================
audio.ontimeupdate = ()=>{
  if(!audio.duration) return;
  progress.value = (audio.currentTime/audio.duration)*100;
  const f=t=>Math.floor(t/60)+":"+("0"+Math.floor(t%60)).slice(-2);
  timeDisplay.innerText = f(audio.currentTime)+" / "+f(audio.duration);
};

progress.oninput = ()=>{
  if(audio.duration){
    audio.currentTime = (progress.value/100)*audio.duration;
  }
};

// ================= PLAYLIST UI =================
function renderPlaylist(){
  const container=document.getElementById("playlist");
  container.innerHTML="";
  tracks.forEach((t,i)=>{
    const el=document.createElement("div");
    el.innerText="🎵 "+t.title;
    el.style.padding="8px";
    el.style.margin="5px";
    el.style.background="#111";
    el.style.cursor="pointer";
    el.onclick=()=>loadTrack(i);
    el.id="track-"+i;
    container.appendChild(el);
  });
}

function highlightTrack(){
  tracks.forEach((_,i)=>{
    const el=document.getElementById("track-"+i);
    if(!el) return;
    el.style.background = i===currentIndex ? "#0ff" : "#111";
    el.style.color = i===currentIndex ? "#000" : "#0ff";
  });
}

// ================= VISUALIZER =================
const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = canvas.offsetWidth;
  canvas.height = 80;
}
resize();
window.addEventListener("resize", resize);

let audioCtx = new (window.AudioContext||window.webkitAudioContext)();
let analyser = audioCtx.createAnalyser();
analyser.fftSize = 2048;
let source, running=false;

document.addEventListener("click", ()=>{
  if(audioCtx.state==="suspended") audioCtx.resume();
});

audio.addEventListener("play", ()=>{
  if(!source){
    source = audioCtx.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
  }
  if(!running){
    running=true;
    draw();
  }
});

function draw(){
  requestAnimationFrame(draw);
  const data = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(data);

  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.beginPath();
  ctx.strokeStyle="#0ff";

  let slice = canvas.width/data.length;
  let x=0;

  for(let i=0;i<data.length;i++){
    let v=data[i]/128.0;
    let y=(v*canvas.height)/2;
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    x+=slice;
  }

  ctx.stroke();
}

// INIT
renderPlaylist();
loadTrack(0);

</script>
  
</body>
</html>
