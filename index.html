<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUN.AI RADIO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:#0ff;
  text-align:center;
}

/* 🌆 BACKGROUND */
body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:radial-gradient(circle,#001,#000);
  z-index:-1;
}

/* 🔥 TITLE */
h1{
  font-size:50px;
  text-shadow:0 0 20px #0ff;
  margin-top:20px;
}
.tagline{
  color:#aaa;
  margin-bottom:20px;
}

/* 📱 PLAYER CARD */
.player{
  width:300px;
  margin:auto;
  background:#0a0a0a;
  border-radius:20px;
  padding:20px;
  box-shadow:0 0 30px #0ff;
}

.cover{
  width:100%;
  border-radius:15px;
  box-shadow:0 0 15px #0ff;
}

/* 🎚 CONTROLS */
.controls{
  margin-top:15px;
}
.controls button{
  background:#111;
  color:#0ff;
  border:none;
  padding:10px;
  margin:5px;
  border-radius:50%;
  box-shadow:0 0 10px #0ff;
}

/* 🌊 WAVE */
.wave{
  height:40px;
  display:flex;
  justify-content:center;
  gap:4px;
}
.wave div{
  width:4px;
  height:10px;
  background:#0ff;
  animation:bounce 1s infinite;
}
@keyframes bounce{
  50%{height:30px;}
}

/* 📊 SIDE FEATURES */
.features{
  display:flex;
  justify-content:space-between;
  margin:20px;
  flex-wrap:wrap;
}
.box{
  width:30%;
  background:#111;
  padding:10px;
  margin:5px;
  border-radius:10px;
  box-shadow:0 0 10px #0ff;
  font-size:12px;
}

/* 🛍 PRODUCT STRIP */
.carousel{
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:10px;
}
.card{
  min-width:150px;
  background:#111;
  padding:10px;
  border-radius:10px;
  box-shadow:0 0 10px #0ff;
}

</style>
</head>

<body>

<h1>RUN.AI RADIO</h1>
<div class="tagline">Stream. Earn. Vibe.</div>

<!-- 📱 PLAYER -->
<div class="player">

  <img src="cover.jpg" class="cover">

  <h3>Future Vibes</h3>
  <small>Neon Dreams</small>

  <!-- 🌊 WAVE -->
  <div class="wave">
    <div></div><div></div><div></div><div></div>
  </div>

  <!-- 🎮 CONTROLS -->
  <div class="controls">
    <button onclick="player.play()">▶</button>
    <button onclick="player.pause()">⏸</button>
  </div>

</div>

<audio id="player" src="music/new1.mp3"></audio>

<!-- ⚡ FEATURES -->
<div class="features">
  <div class="box">📡 LIVE RADIO</div>
  <div class="box">💰 EARN REWARDS</div>
  <div class="box">👥 JOIN</div>
  <div class="box">🎵 UNLIMITED</div>
  <div class="box">⚡ AI POWERED</div>
  <div class="box">🎤 SUPPORT ARTISTS</div>
</div>

<!-- 🛍 PRODUCTS -->
<h3>🛍 Store</h3>
<div class="carousel">
  <div class="card">🎧 Headphones</div>
  <div class="card">👕 Merch</div>
  <div class="card">💿 Tracks</div>
</div>

<!-- 🎙 DJ CHAT -->
<div style="margin-top:20px;">
  <button onclick="window.open('https://chatgpt.com/gg/v/69edd27aec0881939b3622d930d54f13?token=zOLoIYdA4hjhAU7JxKal1g')">
    🎙 DJ Chat
  </button>
</div>

</body>
</html>
