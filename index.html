<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏃🏿‍♂️RUN.🤖AI 📻Radio♾️</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Orbitron', sans-serif;
  background:#000;
  color:#0ff;
  text-align:center;
}
body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:radial-gradient(circle,#001,#000);
  z-index:-1;
}
h1{
  font-size:40px;
  text-shadow:0 0 20px #0ff;
}
.player{
  width:300px;
  margin:auto;
  background:#0a0a0a;
  border-radius:20px;
  padding:20px;
  box-shadow:0 0 30px #0ff;
}
.cover{
  width:100%;
  border-radius:15px;
  box-shadow:0 0 15px #0ff;
}
.controls button{
  background:#111;
  color:#0ff;
  border:none;
  padding:10px;
  margin:5px;
  border-radius:50%;
  box-shadow:0 0 10px #0ff;
}
.active{
  background:#0ff !important;
  color:#000 !important;
}
#visualizer{
  width:100%;
  height:80px;
  margin-top:10px;
}
.modal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
}
.modal-box{
  background:#111;
  padding:20px;
  border-radius:10px;
  box-shadow:0 0 20px #0ff;
  width:280px;
}
.pay-btn{
  display:block;
  margin-top:10px;
  padding:10px;
  background:#0ff;
  color:#000;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>🏃🏿‍♂️RUN.🤖AI 📻Radio</h1>
<div>Stream. Earn. Vibez.</div>

<div class="player">
  <img src="IMG-20260511-WA0001.jpg" class="cover">

  <h3 id="trackName">A.I. Sound Clash</h3>

  <canvas id="visualizer"></canvas>

  <div class="controls">
    <button onclick="audio.play()">▶</button>
    <button onclick="audio.pause()">⏸</button>
    <button onclick="toggleShuffle()" id="shuffleBtn">🔀</button>
    <button onclick="toggleLoop()" id="loopBtn">🔁</button>
  </div>

  <button onclick="openPayment()">💸 Support & Download</button>
  <button id="downloadBtn" style="display:none;" onclick="downloadTrack()">⬇️ Download</button>

  <input type="range" id="progress" value="0" style="width:100%;">
  <div id="time" style="font-size:12px;color:#aaa;">0:00 / 0:00</div>
</div>

<audio id="audio" src="music/Runmix00.mp3"></audio>

<!-- PAYMENT MODAL -->
<div id="paymentModal" class="modal">
  <div class="modal-box">
    <h3>💰 Support Artist</h3>

    <p style="font-size:12px;">
      Send <b>11.50 XLM (BSC)</b><br><br>
      Wallet:<br>
      <b>0x60790faFA18390A53770184E6F8e53E0BC3Cf7D7</b>
    </p>

    <!-- ✅ PAYPAL BUTTON -->
    <a href="https://www.paypal.com/ncp/payment/WY64G3Z528LPS" target="_blank" class="pay-btn">
      💳 Pay with PayPal
    </a>

    <input id="txHash" placeholder="Paste TX Hash" style="width:100%;margin-top:10px;">
    <button onclick="verifyPayment()">✅ Verify</button>
    <button onclick="closeModal()">❌ Close</button>
  </div>
</div>

<script>
const audio = document.getElementById("audio");
const progress = document.getElementById("progress");
const timeDisplay = document.getElementById("time");
const trackNameEl = document.getElementById("trackName");

/* TRACK DATA */
let currentTrack = {
  title: "🏃🏿‍♂️Run📻Mix",
  artist: "Sovereing🤖A.I.",
  file: "music/Runmix00.mp3"
};

trackNameEl.innerText = currentTrack.title + " • " + currentTrack.artist;

/* AUTOPLAY */
document.addEventListener("click", () => {
  audio.play().catch(()=>{});
}, { once:true });

/* PROGRESS */
audio.ontimeupdate = () => {
  if(!audio.duration) return;
  progress.value = (audio.currentTime / audio.duration) * 100;
  const f = t => Math.floor(t/60)+":" + ("0"+Math.floor(t%60)).slice(-2);
  timeDisplay.innerText = f(audio.currentTime) + " / " + f(audio.duration);
};

progress.oninput = () => {
  if(audio.duration){
    audio.currentTime = (progress.value / 100) * audio.duration;
  }
};

/* LOOP + SHUFFLE */
let isShuffle=false, isLoop=false;

function toggleLoop(){
  isLoop=!isLoop;
  loopBtn.classList.toggle("active");
}
function toggleShuffle(){
  isShuffle=!isShuffle;
  shuffleBtn.classList.toggle("active");
}

audio.onended = () => {
  if(isLoop){
    audio.currentTime = 0;
    audio.play();
  } else if(isShuffle){
    audio.currentTime = Math.random() * audio.duration;
    audio.play();
  }
};

/* PAYMENT */
function openPayment(){
  paymentModal.style.display="flex";
}
function closeModal(){
  paymentModal.style.display="none";
}

function verifyPayment(){
  const hash = document.getElementById("txHash").value.trim();
  if(!hash) return alert("Enter TX hash");

  if(hash.length > 10){
    unlockDownload();
    closeModal();
    alert("✅ Payment Verified");
  } else {
    alert("❌ Invalid TX");
  }
}

function unlockDownload(){
  document.getElementById("downloadBtn").style.display="inline-block";
}

/* DOWNLOAD */
function downloadTrack(){
  const a=document.createElement("a");
  a.href=audio.src;
  a.download = currentTrack.title.replace(/\s+/g,"_") + ".mp3";
  a.click();
}

/* VISUALIZER */
const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = canvas.offsetWidth;
  canvas.height = 80;
}
resize();
window.addEventListener("resize", resize);

let audioCtx = new (window.AudioContext||window.webkitAudioContext)();
let analyser = audioCtx.createAnalyser();
analyser.fftSize = 2048;

let source, running=false;

document.addEventListener("click", ()=>{
  if(audioCtx.state==="suspended") audioCtx.resume();
});

audio.onplay = ()=>{
  if(!source){
    source = audioCtx.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
  }
  if(!running){
    running=true;
    draw();
  }
};

function draw(){
  requestAnimationFrame(draw);

  const buffer = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(buffer);

  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.beginPath();
  ctx.strokeStyle="#0ff";

  let slice = canvas.width / buffer.length;
  let x = 0;

  for(let i=0;i<buffer.length;i++){
    let v = buffer[i] / 128.0;
    let y = (v * canvas.height) / 2;
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    x += slice;
  }

  ctx.stroke();
}
</script>

</body>
</html>
