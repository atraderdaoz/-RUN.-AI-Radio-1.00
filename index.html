<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏃🏿‍♂️RUN.🤖AI 📻Radio♾️</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Orbitron', sans-serif;
  background:#000;
  color:#0ff;
  text-align:center;
}
body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:radial-gradient(circle,#001,#000);
  z-index:-1;
}
h1{
  font-size:40px;
  text-shadow:0 0 20px #0ff;
}
.player{
  width:300px;
  margin:auto;
  background:#0a0a0a;
  border-radius:20px;
  padding:20px;
  box-shadow:0 0 30px #0ff;
}
.cover{
  width:100%;
  border-radius:15px;
  box-shadow:0 0 15px #0ff;
}
.controls button{
  background:#111;
  color:#0ff;
  border:none;
  padding:10px;
  margin:5px;
  border-radius:50%;
  box-shadow:0 0 10px #0ff;
}
.active{
  background:#0ff !important;
  color:#000 !important;
}
#visualizer{
  width:100%;
  height:80px;
  margin-top:10px;
}
.features{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin:20px;
}
.box{
  width:120px;
  background:#111;

  border-radius:10px;
  box-shadow:0 0 10px #0ff;
  font-size:12px;
}
.carousel{
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:10px;
}
.card{
  min-width:140px;
  background:#111;
  padding:10px;
  border-radius:10px;
  box-shadow:0 0 10px #0ff;
}
</style>
</head>

<body>

<h1>🏃🏿‍♂️RUN.🤖AI 📻Radio</h1>
<div>Stream. Earn. Vibez.</div>

<div class="player">
  <img src="IMG-20260511-WA0001.jpg" class="cover">
  <h3>Future Vibez</h3>

  <canvas id="visualizer"></canvas>

  <div class="controls">
    <button onclick="audio.play()">▶</button>
    <button onclick="audio.pause()">⏸</button>
    <button onclick="toggleShuffle()" id="shuffleBtn">🔀</button>
    <button onclick="toggleLoop()" id="loopBtn">🔁</button>
  </div>

  <input type="range" id="progress" value="0" style="width:100%;">
  <div id="time" style="font-size:12px;color:#aaa;">0:00 / 0:00</div>
</div>

<audio id="audio" src="music/new1.mp3"></audio>

<div class="features">
  <div class="box">📡 LIVE</div>
  <div class="box">💰 EARN</div>
  <div class="box">👥 JOIN</div>
  <div class="box">🎵 STREAM</div>
  <div class="box">⚡ AI</div>
  <div class="box">🎤 ARTISTS</div>
</div>

<h3>🛍 Store</h3>
<div class="carousel">
  <div class="card">🎧 Headphones</div>
  <div class="card">👕 Merch</div>
  <div class="card">💿 Tracks</div>
</div>

<div style="margin:20px;">
  <button onclick="window.open('https://chatgpt.com/gg/v/69edd27aec0881939b3622d930d54f13?token=zOLoIYdA4hjhAU7JxKal1g')">
    🎙 DJ Chat
  </button>
</div>

<script>
const audio = document.getElementById("audio");
const progress = document.getElementById("progress");
const timeDisplay = document.getElementById("time");

let isShuffle = false;
let isLoop = false;

/* AUTOPLAY (after first click) */
document.addEventListener("click", () => {
  audio.play().catch(()=>{});
}, { once:true });

/* PROGRESS */
audio.ontimeupdate = () => {
  if(!audio.duration) return;
  progress.value = (audio.currentTime / audio.duration) * 100;
  const f = t => Math.floor(t/60)+":" + ("0"+Math.floor(t%60)).slice(-2);
  timeDisplay.innerText = f(audio.currentTime) + " / " + f(audio.duration);
};

progress.oninput = () => {
  if(audio.duration){
    audio.currentTime = (progress.value / 100) * audio.duration;
  }
};

/* LOOP + SHUFFLE */
function toggleLoop(){
  isLoop = !isLoop;
  document.getElementById("loopBtn").classList.toggle("active");
}

function toggleShuffle(){
  isShuffle = !isShuffle;
  document.getElementById("shuffleBtn").classList.toggle("active");
}

/* AUTO END BEHAVIOR */
audio.onended = () => {
  if(isLoop){
    audio.currentTime = 0;
    audio.play();
  } else if(isShuffle){
    // simulate shuffle by restarting random time
    audio.currentTime = Math.random() * audio.duration;
    audio.play();
  }
};

/* VISUALIZER */
const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = canvas.offsetWidth;
  canvas.height = 80;
}
resize();
window.addEventListener("resize", resize);

let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let analyser = audioCtx.createAnalyser();
analyser.fftSize = 2048;

let source;
let running = false;

document.addEventListener("click", () => {
  if(audioCtx.state === "suspended") audioCtx.resume();
});

audio.onplay = () => {
  if(!source){
    source = audioCtx.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
  }
  if(!running){
    running = true;
    draw();
  }
};

function draw(){
  requestAnimationFrame(draw);

  const buffer = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(buffer);

  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.beginPath();
  ctx.strokeStyle="#0ff";
  ctx.lineWidth=2;

  let slice = canvas.width / buffer.length;
  let x = 0;

  for(let i=0;i<buffer.length;i++){
    let v = buffer[i] / 128.0;
    let y = (v * canvas.height) / 2;

    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);

    x += slice;
  }

  ctx.stroke();
}
</script>

</body>
